<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maquette — Photos Assistant</title>
  <style>
    :root { --pine:#1f4f46; --cream:#fbf7ef; --paper:#fffdfa; --ink:#21342f; font-family:Manrope,"Avenir Next",system-ui,sans-serif; color:var(--ink); }
    * { box-sizing:border-box; } body { min-height:100svh; margin:0; background:radial-gradient(circle at 96% 0,#e3f0eb 0,transparent 46%),var(--cream); } button,textarea { font:inherit; } button { cursor:pointer; }
    main { width:min(100%,430px); min-height:100svh; margin:auto; padding:26px 24px 38px; } header { display:flex; align-items:center; justify-content:space-between; }
    .logo { display:grid; width:52px; height:52px; place-items:center; border-radius:12px; color:#f9d179; background:var(--pine); font-size:28px; } .book { min-height:42px; padding:0 15px; border:0; border-radius:999px; color:var(--pine); background:rgba(255,255,255,.76); font-weight:800; }
    h1 { margin:39px 0 30px; color:var(--pine); font-size:clamp(2.55rem,13vw,4rem); line-height:.9; letter-spacing:-.085em; } .bubble { width:max-content; max-width:94%; margin:0 0 18px auto; padding:11px 15px; border-radius:16px 16px 4px 16px; color:#315c53; background:#edf6f1; font-size:.98rem; }
    .composer { position:relative; min-height:274px; overflow:hidden; border:1px solid #d7e2dc; border-radius:23px; background:var(--paper); box-shadow:0 12px 32px rgba(31,79,70,.08); } textarea { display:block; width:100%; min-height:174px; padding:18px 18px 104px; resize:none; border:0; outline:0; background:transparent; font-size:1.02rem; line-height:1.45; }
    .photo-rail { position:absolute; right:13px; bottom:67px; left:13px; display:flex; gap:8px; overflow-x:auto; padding:2px 1px 5px; scrollbar-width:none; } .photo { display:grid; width:52px; height:52px; flex:none; place-items:center; position:relative; overflow:hidden; border-radius:12px; color:#fff; font-size:20px; } .photo:nth-child(1){background:linear-gradient(135deg,#b76936,#f5cf70)} .photo:nth-child(2){background:linear-gradient(135deg,#648d68,#edcd79)} .photo:nth-child(3){background:linear-gradient(135deg,#b55243,#f4a26b)} .photo:nth-child(4){background:linear-gradient(135deg,#78574b,#deb18c)} .photo button { position:absolute; top:3px; right:3px; width:18px; height:18px; padding:0; border:0; border-radius:50%; color:var(--pine); background:#fffdfa; font-weight:900; }
    .actions { position:absolute; right:12px; bottom:12px; display:flex; gap:9px; } .icon { display:grid; width:44px; height:44px; place-items:center; border:0; border-radius:14px; color:#315c53; background:#f0f5f1; font-size:21px; } .mic { background:#e1f1e9; } .send { color:#21342f; background:#f7ca58; font-weight:900; }
    .overlay { position:absolute; z-index:2; inset:0; display:none; grid-template-rows:52px 16px 3em 40px; place-content:center; justify-items:center; row-gap:10px; padding:28px; border-radius:23px; text-align:center; background:rgba(248,252,249,.98); } .is-thinking .overlay { display:grid; }
    .spinner { display:grid; position:relative; width:48px; height:48px; place-items:center; } .spinner::before { position:absolute; inset:0; border:4px solid #d2e6dc; border-top-color:#2f8d76; border-radius:50%; content:""; animation:spin .9s linear infinite; } .spinner-logo { position:relative; display:block; width:25px; height:25px; border-radius:50%; background:var(--pine); } .spinner-logo::before { position:absolute; top:5px; left:7px; width:10px; height:10px; border-radius:50%; background:#f7ca58; content:""; } .spinner-logo::after { position:absolute; right:6px; bottom:5px; left:6px; height:3px; border-radius:99px; background:#fffdfa; content:""; }
    .eyebrow { align-self:end; margin:0; color:#5d7b72; font-size:.75rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; } .message { display:grid; min-height:3em; max-width:18ch; margin:0; align-items:center; color:var(--pine); font-size:1.3rem; font-weight:850; line-height:1.12; letter-spacing:-.04em; } .cancel { align-self:start; min-height:40px; margin:0; padding:0 15px; border:1px solid #b7cec2; border-radius:999px; color:#315c53; background:transparent; font-weight:800; }
    .hint { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:17px; color:#59726a; font-size:.86rem; line-height:1.35; } .toggle { min-height:38px; flex:none; padding:0 12px; border:0; border-radius:999px; color:#fff; background:var(--pine); font-size:.82rem; font-weight:800; } .chips { display:flex; flex-wrap:wrap; gap:9px; margin-top:38px; } .chip { padding:10px 13px; border:1px solid #b9d0c5; border-radius:999px; color:#315c53; background:#f1f7f3; font-size:.86rem; }
    h2 { margin:42px 0 14px; color:var(--pine); font-size:1.2rem; } .card { overflow:hidden; border:1px solid #d8e2dc; border-radius:18px; background:var(--paper); } .card-art { height:118px; background:radial-gradient(circle at 65% 42%,#f5dc84 0 14%,transparent 15%),radial-gradient(circle at 34% 62%,#65955b 0 21%,transparent 22%),linear-gradient(135deg,#b96c3f,#e5bf7c); } .card p { margin:0; padding:12px 13px; color:var(--pine); font-weight:850; }
    @keyframes spin { to { transform:rotate(1turn); } } @media (prefers-reduced-motion:reduce) { .spinner::before { animation:none; } }
  </style>
</head>
<body>
  <main>
    <header><div class="logo">●</div><button class="book">▣&nbsp; Cahier</button></header>
    <h1>On mange quoi&nbsp;?</h1><p class="bubble">Je voudrais cuisiner avec ces quatre photos.</p>
    <section class="composer" id="composer"><textarea aria-label="Votre demande" placeholder="Copiez un lien, ajoutez des photos, une recette ou ce dont vous avez envie"></textarea><div class="photo-rail" aria-label="4 photos jointes"><span class="photo">⌁<button>×</button></span><span class="photo">⌁<button>×</button></span><span class="photo">⌁<button>×</button></span><span class="photo">⌁<button>×</button></span></div><div class="actions"><button class="icon">▧</button><button class="icon mic">♩</button><button class="icon send">↑</button></div><div class="overlay" role="status"><div class="spinner"><span class="spinner-logo"></span></div><p class="eyebrow">Assistant cuisine</p><p class="message" id="message">J’analyse vos 4 photos…</p><button class="cancel" id="cancel">Annuler</button></div></section>
    <div class="hint"><span>Les miniatures restent accessibles, au-dessus des actions.</span><button class="toggle" id="toggle">Voir l’attente</button></div><div class="chips"><span class="chip">Rapide ce soir</span><span class="chip">Préparer une recette</span><span class="chip">Dans mon frigo</span></div><h2>À découvrir dans votre Cahier</h2><article class="card"><div class="card-art"></div><p>Cookies aux pépites de chocolat</p></article>
  </main>
  <script>const c=document.querySelector('#composer'),t=document.querySelector('#toggle'),x=document.querySelector('#cancel'),m=document.querySelector('#message'),s=['J’analyse vos 4 photos…','Je cherche dans votre Cahier…','Je prépare une idée sur mesure…'];let i=0,n;function stop(){clearInterval(n);c.classList.remove('is-thinking');t.textContent='Voir l’attente'}function start(){i=0;m.textContent=s[i];c.classList.add('is-thinking');t.textContent='Revenir au compositeur';n=setInterval(()=>{i=(i+1)%s.length;m.textContent=s[i]},1500)}t.addEventListener('click',()=>c.classList.contains('is-thinking')?stop():start());x.addEventListener('click',stop)</script>
</body></html>
