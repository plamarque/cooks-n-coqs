# Local policy materialized by story-worktree.sh before bmad-loop init.
# It is copied to ignored .bmad-loop/policy.toml in each isolated worktree.

[adapter]
name = "codex"
# BMAD Loop only registers its locally generated relay hook. Keep the Loop's
# existing unattended execution mode and avoid a per-worktree hook approval.
extra_args = [
  "--dangerously-bypass-approvals-and-sandbox",
  "--dangerously-bypass-hook-trust",
]

[scm]
isolation = "worktree"
worktree_seed = [".env"]
